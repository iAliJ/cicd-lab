name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    verify:
        name: verify
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: checkout repository
              uses: actions/checkout@v7

            - name: setup node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: install dependencies
              run: npm ci

            - name: verify application
              run: npm run verify